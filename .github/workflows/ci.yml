name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rentease
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Load schema + procedures + triggers + seed data
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          for f in docs/01_schema.sql docs/02_triggers.sql docs/03_procedures.sql docs/05_seed_data.sql; do
            echo "Loading $f"
            mysql -h 127.0.0.1 -P 3306 -u root -proot rentease < "$f"
          done

      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check .

      - name: Type check (mypy) — informational
        working-directory: apps/api
        run: mypy app || true

      - name: Test (pytest)
        working-directory: apps/api
        env:
          APP_MODE: public
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: rentease
          JWT_SECRET: ci-test-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: pytest

      - name: Dependency audit (pip-audit) — informational
        working-directory: apps/api
        run: pip-audit -r requirements.txt || true

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint

      - name: Type check
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: apps/${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
          NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8002/api/v1
        run: npm run build

      - name: Dependency audit (npm audit) — informational
        working-directory: apps/${{ matrix.app }}
        run: npm audit || true

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: ./apps/api
          - service: admin
            context: ./apps/admin
          - service: customer
            context: ./apps/customer

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
