name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to latest main)"
        required: false

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  gate:
    name: Gate on green CI
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./apps/api
            build_args: ""
          - service: admin
            context: ./apps/admin
            build_args: |
              NEXT_PUBLIC_ADMIN_API_URL=${{ vars.ADMIN_API_PUBLIC_URL }}
          - service: customer
            context: ./apps/customer
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.CUSTOMER_API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (Trivy) — informational
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ needs.gate.outputs.sha }}
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  deploy:
    name: Deploy to production
    needs: [gate, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Copy docker-compose.prod.yml to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,backups/backup.sh"
          target: "~/rentease"
          strip_components: 0

      - name: Pull images, restart stack, health-check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY,IMAGE_NAMESPACE
          script: |
            set -euo pipefail
            cd ~/rentease
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REGISTRY=ghcr.io
            export IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
            export IMAGE_TAG=${{ needs.gate.outputs.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            echo "Waiting for health checks..."
            for i in $(seq 1 30); do
              PUBLIC_OK=$(curl -fs http://localhost:8001/health >/dev/null 2>&1 && echo 1 || echo 0)
              ADMIN_OK=$(curl -fs http://localhost:8002/health >/dev/null 2>&1 && echo 1 || echo 0)
              if [ "$PUBLIC_OK" = "1" ] && [ "$ADMIN_OK" = "1" ]; then
                echo "$IMAGE_TAG" > ~/rentease/.last-known-good
                echo "Healthy. Recorded $IMAGE_TAG as last-known-good."
                exit 0
              fi
              sleep 5
            done

            echo "Health checks failed after 150s" >&2
            exit 1

  rollback-on-failure:
    name: Rollback to last-known-good
    needs: [gate, deploy]
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Redeploy last-known-good tag
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/rentease
            if [ ! -f .last-known-good ]; then
              echo "No last-known-good tag recorded, nothing to roll back to." >&2
              exit 1
            fi
            export REGISTRY=ghcr.io
            export IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
            export IMAGE_TAG=$(cat .last-known-good)
            echo "Rolling back to $IMAGE_TAG"
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
