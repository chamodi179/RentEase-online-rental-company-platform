version: "3.9"

# NOTE: MySQL is NOT defined here — it's already running on your host
# machine (localhost:3306, user=root, password=root, db=rentease, per your
# screenshot) with the schema already loaded. Containers reach it via
# host.docker.internal (mapped explicitly below for Linux compatibility;
# Docker Desktop on Mac/Windows supports this out of the box).

services:
  redis:
    image: redis:7
    restart: unless-stopped

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the browser (localhost:3000) PUT directly to MinIO's presigned
      # URLs — without this, the upload XHR fails as a CORS error.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # One-shot init: creates the "rentease" bucket if it doesn't exist yet,
  # then exits. Presigned PUTs 403 until this bucket exists.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/rentease;
      "

  # ---- Backend: same image, two isolated running instances ----
  # (architecture doc: one codebase, two processes, two failure domains —
  # not microservices; see Section 0 of RentEase_Architecture.md)
  api-public:
    build: ./apps/api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach your host's MySQL
    environment:
      APP_MODE: public
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rentease
      DB_POOL_SIZE: "20"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: rentease
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - minio-init
    ports:
      - "8001:8000"

  api-admin:
    build: ./apps/api  # same Dockerfile/image as api-public — differs only by APP_MODE
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_MODE: admin
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rentease
      DB_POOL_SIZE: "10"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3001
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
    ports:
      - "8002:8000"

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rentease

  # ---- Frontends: separate Next.js apps, each pointed at its own instance ----
  customer-web:
    build:
      context: ./apps/customer
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    restart: unless-stopped
    depends_on:
      - api-public
    environment:
      # Used by the browser (runs on your host machine, so it needs the published port)
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      # Used by Next.js server components / SSR fetches, which run *inside* this
      # container. "localhost" in here would mean the customer-web container
      # itself, not api-public, so this must use the Docker Compose service name.
      API_URL_INTERNAL: http://api-public:8000/api/v1
    ports:
      - "3000:3000"

  admin-web:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8002/api/v1
    restart: unless-stopped
    depends_on:
      - api-admin
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8002/api/v1
      ADMIN_API_URL_INTERNAL: http://api-admin:8000/api/v1
    ports:
      - "3001:3001"

volumes:
  minio_data: