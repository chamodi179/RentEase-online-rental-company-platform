version: "3.9"

# NOTE: MySQL is NOT defined here — DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/
# DB_NAME are read from the root .env file (gitignored) and point at the
# remote RDS instance. The old host.docker.internal extra_hosts entries
# below are now unused but harmless — safe to remove once you've confirmed
# everything connects to RDS.

services:
  redis:
    image: redis:7
    restart: unless-stopped

  # Local SMTP server + web UI for booking confirmation emails (spec §4.2).
  # The worker actually sends real SMTP messages to this container instead
  # of just printing to the console — open http://localhost:1080 to see
  # them land. Swap SMTP_* env vars on the worker service for a real
  # provider (SES/SendGrid SMTP relay, etc.) in production; no code change
  # needed.
  mailer:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP

  # Automated daily database backup (spec §6). MySQL itself isn't a
  # container here (see NOTE above) — this dumps the host's MySQL the same
  # way the API containers reach it, via host.docker.internal.
  db-backup:
    image: mysql:8
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-rentease}
      RETENTION_DAYS: "7"
      BACKUP_HOUR: "2" # 2am container-local time
    volumes:
      - ./backups/backup.sh:/backup.sh:ro
      - db_backups:/backups

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the browser (localhost:3000) PUT directly to MinIO's presigned
      # URLs — without this, the upload XHR fails as a CORS error.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # One-shot init: creates the "rentease" bucket if it doesn't exist yet,
  # then exits. Presigned PUTs 403 until this bucket exists.
  # The bucket itself stays private (KYC documents live here too), but
  # item-photos/* is opened up for anonymous read — catalog photos are
  # public-facing product images, not sensitive documents, so there's no
  # reason to pay for presigned-GET signing/expiry on every catalog view.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/rentease;
      mc anonymous set download local/rentease/item-photos;
      "

  # ---- Backend: same image, two isolated running instances ----
  # (architecture doc: one codebase, two processes, two failure domains —
  # not microservices; see Section 0 of RentEase_Architecture.md)
  api-public:
    build: ./apps/api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach your host's MySQL
    environment:
      APP_MODE: public
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-rentease}
      DB_POOL_SIZE: "20"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: rentease
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - minio-init
      - redis
    ports:
      - "8001:8000"

  api-admin:
    build: ./apps/api  # same Dockerfile/image as api-public — differs only by APP_MODE
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_MODE: admin
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-rentease}
      DB_POOL_SIZE: "10"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3001
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      # cancel_booking() -> refund_booking_payment() runs from this instance
      # too (admin "mark cancelled" flow, see routers/admin/bookings.py), and
      # refund_service.py sets stripe.api_key at import time from this var.
      # Without it, api-admin silently fell back to config.py's
      # "sk_test_placeholder" default, so every admin-initiated card refund
      # failed against Stripe even with a real key configured for api-public.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      # Catalog/photo presigning (routers/admin/items.py) needs these too.
      # Previously unset here — it only worked because these happen to match
      # config.py's defaults; explicit now so a MinIO credential rotation
      # doesn't silently break this instance while api-public keeps working.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: rentease
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - redis
    ports:
      - "8002:8000"

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - mailer
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-rentease}
      SMTP_HOST: mailer
      SMTP_PORT: "1025"
      SMTP_FROM: "RentEase <bookings@rentease.local>"

  # Separate process from `worker` — beat only enqueues tasks on a timer
  # (expire_stale_pending_bookings, see worker.py's beat_schedule), the
  # `worker` service above still does the actual work. Same image/env
  # since it needs the same DB access to import app.worker's task
  # definitions, even though this task doesn't send email.
  beat:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.worker beat --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-rentease}

  # ---- Frontends: separate Next.js apps, each pointed at its own instance ----
  customer-web:
    build:
      context: ./apps/customer
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    restart: unless-stopped
    depends_on:
      - api-public
    environment:
      # Used by the browser (runs on your host machine, so it needs the published port)
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      # Used by Next.js server components / SSR fetches, which run *inside* this
      # container. "localhost" in here would mean the customer-web container
      # itself, not api-public, so this must use the Docker Compose service name.
      API_URL_INTERNAL: http://api-public:8000/api/v1
    ports:
      - "3000:3000"

  admin-web:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8002/api/v1
    restart: unless-stopped
    depends_on:
      - api-admin
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8002/api/v1
      ADMIN_API_URL_INTERNAL: http://api-admin:8000/api/v1
    ports:
      - "3001:3001"

volumes:
  minio_data:
  db_backups: