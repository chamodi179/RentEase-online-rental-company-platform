[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Starting narrow since this codebase has never been linted before — CI
# should catch real bugs (unused imports/vars, undefined names) without
# drowning the first PR in hundreds of pre-existing style nits. Widen this
# (e.g. add "I" for import sorting, "UP" for pyupgrade) in a follow-up once
# the codebase is clean against this baseline.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — enforced above via line-length, not as a hard error
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Same rationale as ruff above: non-strict baseline first, tighten later.
disallow_untyped_defs = false
